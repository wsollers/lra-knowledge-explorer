# =============================================================
# rebuild.yml — lra-knowledge-explorer
#
# Triggers:
#   1. repository_dispatch from any lra-* repo pushing to main.
#   2. Manual workflow_dispatch.
#   3. Direct push to this repo (scripts or HTML changed).
#
# What it does:
#   - Checks out lra-knowledge-explorer (scripts + HTML live here).
#   - Checks out Learning-Real-Analysis (LaTeX source lives there).
#   - Runs the extraction pipeline against the LaTeX source.
#   - Commits updated knowledge.json + graph-edges.json back here.
#   - Deploys the explorer to GitHub Pages.
#
# Required secret:
#   SYNC_PAT — GitHub PAT with repo scope (for checking out mono-repo
#               and pushing the updated JSON back).
# =============================================================

name: Rebuild Knowledge Explorer

on:
  repository_dispatch:
    types:
      - lra-rebuild          # sent by any lra-* repo on push to main

  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'knowledge-explorer.html'
      - 'real-analysis-explorer.html'
      - 'index.html'

  workflow_dispatch:         # manual trigger

jobs:
  rebuild:
    name: Extract & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout lra-knowledge-explorer
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          path: explorer

      - name: Checkout Learning-Real-Analysis (LaTeX source)
        uses: actions/checkout@v4
        with:
          repository: wsollers/Learning-Real-Analysis
          token: ${{ secrets.SYNC_PAT }}
          path: lra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run extraction pipeline
        run: |
          cd lra
          python theorem-explorer/run_extraction.py

      - name: Copy outputs to explorer repo
        run: |
          cp lra/theorem-explorer/knowledge.json       explorer/knowledge.json
          cp lra/theorem-explorer/graph-edges.json     explorer/graph-edges.json
          cp lra/theorem-explorer/proof-errors.json    explorer/proof-errors.json  2>/dev/null || true
          cp lra/theorem-explorer/graph-edge-errors.json explorer/graph-edge-errors.json 2>/dev/null || true

      - name: Commit updated JSON
        run: |
          cd explorer
          git config user.name  "lra-knowledge-bot"
          git config user.email "knowledge-bot@noreply.github.com"
          git add knowledge.json graph-edges.json proof-errors.json graph-edge-errors.json || true
          git diff --cached --quiet && echo "No changes to JSON" && exit 0
          git commit -m "chore: rebuild knowledge graph [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: explorer

  deploy:
    name: Deploy to GitHub Pages
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
