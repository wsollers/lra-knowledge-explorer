name: Rebuild Knowledge Explorer

on:
  repository_dispatch:
    types: [lra-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-explorer-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout explorer
        uses: actions/checkout@v4
        with:
          path: explorer
          token: ${{ secrets.SYNC_PAT }}

      - name: Checkout Volume I
        uses: actions/checkout@v4
        with:
          repository: wsollers/lra-volume-i
          path: lra-volume-i
          token: ${{ secrets.SYNC_PAT }}

      - name: Checkout Volume II
        uses: actions/checkout@v4
        with:
          repository: wsollers/lra-volume-ii
          path: lra-volume-ii
          token: ${{ secrets.SYNC_PAT }}

      - name: Checkout Volume III
        uses: actions/checkout@v4
        with:
          repository: wsollers/lra-volume-iii
          path: lra-volume-iii
          token: ${{ secrets.SYNC_PAT }}

      - name: Checkout proof vault
        uses: actions/checkout@v4
        with:
          repository: wsollers/lra-proof-vault
          path: lra-proof-vault
          token: ${{ secrets.SYNC_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install extraction dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Run split-volume extraction
        working-directory: explorer
        run: python scripts/run_extraction.py --repos-root "$GITHUB_WORKSPACE"

      - name: Build proof vault index
        working-directory: explorer
        run: python scripts/build_proof_vault_index.py

      - name: Validate generated JSON
        working-directory: explorer
        run: |
          python -m json.tool knowledge.json >/dev/null
          python -m json.tool graph-edges.json >/dev/null
          python -m json.tool proof-errors.json >/dev/null
          python -m json.tool graph-edge-errors.json >/dev/null

      - name: Commit and push if changed
        working-directory: explorer
        run: |
          git config user.name "lra-explorer-bot"
          git config user.email "explorer-bot@noreply.github.com"
          git add knowledge.json graph-edges.json proof-errors.json graph-edge-errors.json proof-vault-index.json
          if git diff --cached --quiet; then
            echo "No explorer data changes."
            exit 0
          fi
          git commit -m "Refresh knowledge explorer data"
          git push
