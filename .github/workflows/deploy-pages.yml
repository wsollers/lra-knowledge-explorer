name: Deploy Knowledge Explorer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "index.html"
      - "knowledge-explorer.html"
      - "real-analysis-explorer.html"
      - "knowledge.json"
      - "model-artifacts.json"
      - "graph-edges.json"
      - "proof-errors.json"
      - "proof-vault-index.json"
      - "graph-edge-errors.json"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout lra-knowledge-explorer
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
